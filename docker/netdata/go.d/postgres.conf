# Netdata 的 PostgreSQL 采集插件配置。连接用只读监控角色（见
# docker/postgres-initdb/01_netdata_monitor_role.sh），不复用应用连接账号。
# 密码通过 NETDATA_PG_PASSWORD 环境变量与建角色脚本共用同一个值，这里按官方镜像文档
# 的写法写死连接串——Netdata 的采集配置不支持 ${VAR} 替换，改密码需要同时改这里。
jobs:
  - name: keywordiq-selfhosted
    dsn: 'postgresql://netdata:netdata_monitor_only@db:5432/amazon_search'
