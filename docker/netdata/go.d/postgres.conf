# Netdata 的 PostgreSQL 采集插件配置。连接用只读监控角色（见
# docker/postgres-initdb/01_netdata_monitor_role.sh），不复用应用连接账号。
# 密码、库名都按官方镜像文档的写法写死在连接串里——Netdata 的采集配置不支持 ${VAR}
# 替换。密码与 01_netdata_monitor_role.sh 的建角色语句共用同一个值，库名与 .env 的
# POSTGRES_DB 共用同一个值：**改任一项都要同时手工改这里**，否则 Netdata 会连一个
# 不存在（或密码不对）的库，采集静默失败、PostgreSQL 那组图表整体消失，没有任何报错。
jobs:
  - name: keywordiq-selfhosted
    dsn: 'postgresql://netdata:netdata_monitor_only@db:5432/amazon_search'
