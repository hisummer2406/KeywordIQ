<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>KeywordIQ 竞对采集设置</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 24px auto; color: #222; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
      button { margin-top: 16px; padding: 8px 16px; }
      p.hint { color: #666; font-size: 13px; }
      p.status { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>KeywordIQ 竞对采集设置</h1>
    <p class="hint">
      这是临时的鉴权方案：从已登录的 KeywordIQ 网页里复制访问令牌，粘贴到下面
      （具体去哪个页面、复制哪个字段，见 README）。令牌当前有效期 24 小时，过期后
      需要重新粘贴。
    </p>

    <label for="api-base">API 地址</label>
    <input id="api-base" type="text" placeholder="http://localhost:8000" />

    <label for="token">访问令牌</label>
    <input id="token" type="password" placeholder="粘贴从网页复制的令牌" />

    <label for="max-report-items">单次上报条数上限</label>
    <input id="max-report-items" type="number" min="1" step="1" placeholder="200" />
    <p class="hint">
      必须与后端环境变量 <code>COMPETITOR_MAX_REPORT_ITEMS</code> 的实际值一致
      （默认 200，向部署此服务的管理员确认）。填小了插件会过早拒绝继续采集；
      填大了插件允许攒到超过服务端真实上限，提交时才会收到失败响应。
    </p>

    <button id="save">保存</button>
    <p id="status" class="status"></p>

    <script src="options.js"></script>
  </body>
</html>
