schema: spec-driven

context: |
  KeywordIQ：FastAPI + PostgreSQL + AntD Pro，依赖由 uv/pnpm 管理。
  先读 CLAUDE.md；按任务影响范围读取 .claude/rules/，业务行为读取已有 openspec/specs。
  规格/设计/操作导航见 openspec/guides/README.md；不要把功能清单、历史状态或完整配置复制进 Agent 指令。
  默认值查 .env.example/config.py；生产操作先读 docs/ops/v2-ecs-handoff.md。

rules:
  proposal:
    - 用中文撰写
    - 明确写出该变更影响日报路径、周报路径，还是两者
  design:
    - 涉及数据库改动时，必须说明 Alembic 迁移方案及其对 `analysis` schema 的处理
    - 涉及查询或导入改动时，必须说明对连接池占用、内存占用与索引/执行计划的影响
  tasks:
    - 单个任务控制在 2 小时以内
    - 涉及行为变更的任务必须包含一条可用 `uv run pytest test/` 验证的测试任务
