[project]
name = "keywordiq"
version = "0.1.0"
description = "Amazon search term data analysis platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy[asyncio]==2.0.23",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # python-multipart 无直接 import，但 upload_api 的 File/Form/UploadFile 依赖它，勿删
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=5.9.0",  # monitoring.py 的系统指标采集
    "oss2>=2.19.1",
    "aliyun-python-sdk-sts>=3.1.3",
    # 曾错放在 dev 分组：钉钉 SSO 客户端（app/auth/dingtalk_client.py）与独立站/竞对
    # 抓取（app/table/competitor/store_service.py、store_fetcher.py）在运行时导入它，
    # 不是仅测试用。`uv sync --no-dev`（Dockerfile 生产镜像的标准做法）此前会装出一个
    # 启动即 ModuleNotFoundError 的镜像——本地开发一直用不带 --no-dev 的 uv sync，
    # 这个分类错误因此从未在本地暴露过。
    "httpx<0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

# ------------------------------------------------------------------------
# ruff：语法层铁律的执行者。
#
# 它负责能用「看一个文件就判定」的方式表达的约束——尤其是 ASYNC 那组，
# 直接对应 CLAUDE.md 里「不要在事件循环上跑阻塞调用」这条（历史上真出过事）。
# 表达不了的项目特有铁律在 test/test_conventions.py，两边不重叠。
# ------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "alembic/versions", "frontend"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes：未使用导入/变量、未定义名字
    "E4", "E7", "E9",  # pycodestyle 里真会出错的那部分
    "W",      # 尾随空白之类
    "I",      # import 排序
    "UP",     # pyupgrade：跟上 py311
    "B",      # bugbear：可变默认参数、循环里的闭包等真坑
    "ASYNC",  # 事件循环上的阻塞调用 —— 本项目的重点
    "TID",    # 配合下面的 banned-api
    "RUF",    # ruff 自有规则
]
ignore = [
    "B008",   # FastAPI 的 Depends()/Query() 就是要在默认值里调用，与本项目写法冲突
    # 本仓库注释与用户可见文案是中文，全角标点是正常内容不是「疑似歧义字符」。
    # 开着会产生 1300+ 条纯噪声，把真问题淹掉。
    "RUF001", "RUF002", "RUF003",
    # SQLAlchemy 的 __table_args__ / model_config 就是类级 dict，是框架规定写法。
    "RUF012",
]

# Pydantic v1 / SQLAlchemy 1.x 的遗留用法里，凡是「靠 import 就能认出来」的都在这里拦。
# 方法调用形式的（.dict()、.parse_obj()、class Config、.query()）ruff 表达不了，
# 由 test/test_conventions.py 接手。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.validator".msg = "Pydantic v2 用 @field_validator（见 CLAUDE.md「Pydantic 2.0 Only」）"
"pydantic.root_validator".msg = "Pydantic v2 用 @model_validator"
"pydantic.parse_obj_as".msg = "Pydantic v2 用 TypeAdapter"
"sqlalchemy.orm.declarative_base".msg = "SQLAlchemy 2.0 用 DeclarativeBase 子类（见 CLAUDE.md「SQLAlchemy 2.0 Only」）"
"sqlalchemy.ext.declarative.declarative_base".msg = "SQLAlchemy 2.0 用 DeclarativeBase 子类"

[tool.ruff.lint.per-file-ignores]
# 测试里为了构造违规样本会故意写反面用例；
# E702 是测试夹具惯用的紧凑写法（`trans.rollback(); conn.close()`），不是疏忽。
"test/*" = ["B", "RUF", "E702"]

[tool.pytest.ini_options]
markers = [
    "conventions: 项目铁律检查（不连库，亚秒级；提交门禁与 CI 都会跑）",
]
# 查询与鉴权路径已异步化，其集成测试需要事件循环。auto 模式让 async def 测试与
# async fixture 无需逐个标注 @pytest.mark.asyncio；同步测试不受影响。
asyncio_mode = "auto"
