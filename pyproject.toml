[project]
name = "keywordiq"
version = "0.1.0"
description = "Amazon search term data analysis platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy[asyncio]==2.0.23",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pandas==2.1.4",
    "pyarrow==14.0.2",
    "dask[dataframe]==2023.12.1",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
    "jinja2==3.1.2",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "celery==5.3.4",
    "redis==5.0.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=5.9.0",
    "oss2>=2.19.1",
    "aliyun-python-sdk-sts>=3.1.3",
]

[dependency-groups]
dev = [
    "httpx<0.28",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
