# KeywordIQ 前端 SPA 的 nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）。
# 职责：托管 SPA 静态产物 + history 深链接回退 + 反代 /api 到后端 uvicorn。
#
# 注意：V2 采用 OSS-first 直传，GB 级文件直传 OSS、不经 nginx，故 client_max_body_size
# 无需设到 3G；这里留 100M 余量供本地退路（OSS_ENABLED=false 时 /api/upload/import-csv）。

upstream keywordiq_api {
    # docker-compose 中后端服务名:端口。非容器部署改为 127.0.0.1:8000。
    server app:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;

    # 带内容哈希的静态资源（Umi 产在 dist 根，形如 umi.3c07.js）：长缓存、不可变
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://keywordiq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 导入/导出等长耗时接口
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查透传后端
    location /health {
        proxy_pass http://keywordiq_api;
        access_log off;
    }

    # SPA history 回退：非资源、非 API 的路径一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
