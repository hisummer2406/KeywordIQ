# /etc/nginx/conf.d/key.liangtong.online.conf
#
# V2 独立站点。V1 的 amazon.liangtong.online 仍使用 127.0.0.1:8000，不能复用本文件。

upstream keywordiq_v2_api {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name key.liangtong.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name key.liangtong.online;

    ssl_certificate     /etc/nginx/ssl/key.liangtong.online/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/key.liangtong.online/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/keywordiq-web;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://keywordiq_v2_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://keywordiq_v2_api;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/key.liangtong.online.access.log;
    error_log /var/log/nginx/key.liangtong.online.error.log;
}
