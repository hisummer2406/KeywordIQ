# /etc/nginx/conf.d/key.liangtong.online_80.conf（V2 ECS 上实际生效的文件名；换机器时
# 先 `nginx -T | grep server_name` 确认，别再新建一份同名 upstream/server_name）
#
# V2 独立站点。V1 的 amazon.liangtong.online 仍使用 127.0.0.1:8000，不能复用本文件。

upstream keywordiq_v2_api {
    server 127.0.0.1:8001;
}

upstream keywordiq_ops_bot {
    server 127.0.0.1:8101;
}

server {
    listen 80;
    listen [::]:80;
    server_name key.liangtong.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name key.liangtong.online;

    ssl_certificate     /etc/nginx/ssl/key.liangtong.online/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/key.liangtong.online/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/keywordiq-web;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://keywordiq_v2_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://keywordiq_v2_api;
        access_log off;
    }

    # 飞书运维机器人是独立的 host 级 systemd 服务；事件订阅与卡片回传都经此入口。
    location /ops/ {
        proxy_pass http://keywordiq_ops_bot/ops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 入口页与 Manifest 每次向服务端校验（ETag → 未变化返回 304），发布后联网重新加载即得新版
    # （issue #92，可安装网站应用）。
    #
    # 不设它的话，浏览器对没有 Cache-Control 的响应做启发式缓存：已安装的独立窗口会在一段
    # 时间内继续用旧 index.html，进而去加载旧哈希的产物——旧产物文件还在磁盘上时甚至不会
    # 报错，用户只是「看不到新功能」。带哈希的产物文件名每版都变，不受这条影响。
    #
    # `location = /index.html` 能覆盖所有深链接：下面 `try_files` 的兜底与 `index` 指令都是
    # 内部重定向到 /index.html，会重新走 location 匹配。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 老版本 nginx 的 mime.types 没有 .webmanifest，会按 application/octet-stream 返回。
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/key.liangtong.online.access.log;
    error_log /var/log/nginx/key.liangtong.online.error.log;
}
