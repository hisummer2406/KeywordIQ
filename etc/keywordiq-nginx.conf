# /etc/nginx/sites-available/keywordiq
#
# 部署形态：宿主机 nginx + Docker Compose 管理的应用容器（127.0.0.1:8000，见
# docker-compose.yml）。nginx 直接托管前端 SPA 产物，只把 /api 与 /health 反代给
# 容器化的后端——容器化只改变了 8000 端口背后跑的是什么，这份 nginx 配置本身不变。
#
# 前端产物来自 `cd frontend && pnpm install && pnpm build` 生成的 dist/，
# 部署时同步到下面的 root 目录（如 rsync -a --delete frontend/dist/ /var/www/keywordiq/）。

upstream keywordiq_api {
    server 127.0.0.1:8000;
}

# 飞书运维机器人（ops-bot），host 级 systemd 服务，见
# openspec/changes/add-feishu-ops-bot/design.md D1。与 keywordiq_api 分开定义，
# 不共用同一个 upstream——两者是完全独立的进程，混在一起会让"改业务端口误伤运维
# 通道"这类失误更容易发生。
upstream keywordiq_ops_bot {
    server 127.0.0.1:8101;
}

# 请求编号关联：nginx 是 request id 的唯一权威生成者（$request_id 是 nginx 1.11+
# 内置变量，每个请求一个 32 位十六进制串），统一覆盖、不判断客户端是否已带头——
# 本系统是内部工具，没有需要透传自身 trace id 的外部调用方，见
# openspec/changes/add-request-diagnostics-logging/design.md 决策 C。
# 应用侧 RequestIdMiddleware 现有的"入站已带则沿用"逻辑不用改，行为上现在总会
# 沿用这里生成的值。
#
# $request_time / $upstream_response_time 让一次慢请求能看出耗时是花在 nginx 排队
# 还是应用处理；代理层连接失败（502/504）时 $upstream_status/$upstream_response_time
# 是 "-"，但 $request_id 仍然有值——代理层失败也有可检索的编号。
log_format keywordiq_main
    '$remote_addr - [$time_local] "$request" '
    'status=$status upstream_status=$upstream_status '
    'request_time=$request_time upstream_time=$upstream_response_time '
    'request_id=$request_id bytes=$body_bytes_sent referer="$http_referer"';

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # SPA 产物目录（部署时把 frontend/dist/ 的内容同步到这里）
    root /var/www/keywordiq;
    index index.html;

    # V2 走 OSS-first 直传：GB 级文件由浏览器直传 OSS，不经 nginx，
    # 故无需再放到 3G。这里留 100M 供本地退路（OSS_ENABLED=false 时的 /api/upload/import-csv）。
    client_max_body_size 100M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;

    # 带内容哈希的静态资源（Umi 产在 dist 根，形如 umi.3c07.js）：长缓存、不可变
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://keywordiq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # 导入/导出等长耗时接口
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查透传后端
    location /health {
        proxy_pass http://keywordiq_api;
        access_log off;
    }

    # 飞书运维机器人：事件订阅回调 + 自身心跳，反代到 host 级 ops-bot 服务
    # （127.0.0.1:8101）。飞书事件订阅要求公网 HTTPS 回调，复用本站点已有证书，
    # 不需要新开一个域名/server 块。
    location /ops/ {
        proxy_pass http://keywordiq_ops_bot/ops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # SPA history 回退：非资源、非 API 的路径一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/keywordiq.access.log keywordiq_main;
    error_log /var/log/nginx/keywordiq.error.log;
}

# 可选：Netdata 监控面板的远程访问路径之一（另一个更简单的选项是 SSH 隧道，
