# /etc/logrotate.d/keywordiq
#
# 4 个 uvicorn worker 进程共享同一个 logs/app.log（bind mount 到宿主机，见
# docker-compose.yml）。应用侧用 WatchedFileHandler（见 main.py），本身不做轮转，
# 只在检测到文件被替换后重新打开——轮转的权威在这份配置里，由宿主机的 logrotate
# （通常经 cron.daily 触发）执行。
#
# 部署步骤：
#   sudo cp etc/keywordiq-logrotate.conf /etc/logrotate.d/keywordiq
#   sudo logrotate -d /etc/logrotate.d/keywordiq   # 空跑校验语法与匹配路径，不落地
#
# 与 docker-compose.yml 的 `- ./logs:/app/logs` 挂载路径对应，这里写的是宿主机侧
# 的绝对路径，按实际部署路径调整。

/path/to/keywordiq/logs/app.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    # 显式 create，不用 copytruncate：copytruncate 对多个仍持有旧写偏移量的进程
    # 不安全——ftruncate 之后进程按旧偏移量继续 write() 会在文件中留下 NUL 字节
    # 空洞，直到偏移量重新对齐；create 则是 rename 旧文件 + 新建同名空文件，
    # WatchedFileHandler 在下一次 emit() 时侦测到 inode 变化即会重新以偏移量 0
    # 打开新文件，没有这个问题。
    create 644 root root
}
