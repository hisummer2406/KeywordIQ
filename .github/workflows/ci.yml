name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 判定检查范围
    # V1 的 main 保持原行为；v2 草稿不分配 runner。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/v2') || (github.event_name == 'pull_request' && github.base_ref == 'v2' && !github.event.pull_request.draft)
    runs-on: [self-hosted, linux, x64, mbp-ci]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      extension: ${{ steps.scope.outputs.extension }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 验证 CI 范围策略
        run: node --test .github/ci-scope.test.cjs .github/ci-evidence.test.cjs
      - name: 按固定 SHA 与已验证基线比较文件
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const { resolveScope } = require('./.github/ci-evidence.cjs');
            const checks = await resolveScope({ github, context, core });
            for (const [name, enabled] of Object.entries(checks)) {
              core.setOutput(name, String(enabled));
            }
            core.info(`本次检查范围：${JSON.stringify(checks)}`);

  backend:
    name: 后端（pytest + alembic）
    needs: changes
    # main 全量；v2 按范围，判定失败/输出缺失时全量。
    if: >-
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main' ||
       ((github.event_name == 'push' || !github.event.pull_request.draft) &&
        (needs.changes.result != 'success' || needs.changes.outputs.backend != 'false')))
    runs-on: [self-hosted, linux, x64, mbp-ci]
    timeout-minutes: 30

    # 生产是 RDS PostgreSQL 15，这里对齐大版本。
    # 起真库的目的有二：让 test_database.py 的连通性用例有意义，
    # 并解开 TEST_DATABASE_URL gate，把查询层集成测试也跑上。
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keywordiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # config.Settings 的必填项。DATABASE_* 在 .env.example 里是注释掉的示例，
      # 不能直接 cp 使用，故这里显式给出。
      APP_NAME: KeywordIQ
      VERSION: 1.0.0
      DEBUG: "False"
      ADMIN_SECRET_KEY: ci-dummy-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keywordiq_test
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/keywordiq_test
      DATABASE_SCHEMA: analysis
      # ops_bot/database.py 在模块导入时就 create_engine()（SQLAlchemy 引擎本身是惰性的，
      # 这里不会真的建连）——留空会在 collection 阶段直接抛 ArgumentError，炸掉全部
      # test_ops_bot_*_unit.py（它们只 patch 会话工厂，不连真库，语法合法的 URL 即可）。
      OPS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keywordiq_test
      OPS_DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/keywordiq_test
      ENABLED_SITES: US,GB,DE
      DEFAULT_SITE: US
      # 解开集成测试的 skip gate（test/test_site_scoped_query_integration.py）
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keywordiq_test

    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        # 不传 GitHub 缓存（自托管 runner 上 auto 即关闭）；uv 缓存走 runner .env 的 UV_CACHE_DIR，跨 job 持久。
        uses: astral-sh/setup-uv@v7

      - name: 安装依赖（按 .python-version + uv.lock）
        run: uv sync --locked

      # 与本地提交门禁（.claude/hooks/pre_commit.py）跑的是同一条命令、同一份配置。
      # 规则只有一份，本地和 CI 不会漂移。
      - name: ruff
        run: uv run ruff check .

      - name: 迁移测试库
        run: uv run alembic upgrade head

      - name: 迁移可回滚性（降一步再升回来）
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: pytest
        run: uv run pytest test/ -q

  frontend:
    name: 前端（lint + tsc + test + build）
    needs: changes
    if: >-
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main' ||
       ((github.event_name == 'push' || !github.event.pull_request.draft) &&
        (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false')))
    runs-on: [self-hosted, linux, x64, mbp-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          # frontend/pnpm-lock.yaml 是 lockfileVersion 9.0
          version: 9

      - uses: actions/setup-node@v5
        with:
          # 22 不是 20：jsdom 30 依赖的 undici 8 在 Node 20 上起不来
          # （`webidl.util.markAsUncloneable is not a function`，vitest 整批 Unhandled
          # Error）。开发机是 22.x，CI 跟上才谈得上"CI 绿等于本地绿"。
          node-version: 22

      # 不用 setup-node 的 pnpm 缓存：自托管 runner 的 pnpm store 由 runner .env 的 npm_config_store_dir 固定在本机持久目录，
      # 上传 GitHub 缓存要经代理传几百 MB 到 Azure，曾卡死收尾步骤。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: 类型检查
        run: pnpm tsc

      - name: 单元测试（vitest）
        run: pnpm test

      - name: 构建 SPA 产物
        run: pnpm build

  extension:
    name: 竞对采集插件（typecheck + test + build）
    needs: changes
    if: >-
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main' ||
       ((github.event_name == 'push' || !github.event.pull_request.draft) &&
        (needs.changes.result != 'success' || needs.changes.outputs.extension != 'false')))
    runs-on: [self-hosted, linux, x64, mbp-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试（vitest）
        run: pnpm run test

      - name: 构建
        run: pnpm run build

  release-ready:
    name: 发布就绪（按范围校验）
    needs: [changes, backend, frontend, extension]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: [self-hosted, linux, x64, mbp-ci]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 核对受影响项成功、未受影响项按规则跳过
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node -e "require('./.github/ci-evidence.cjs').validateNeeds(JSON.parse(process.env.CI_NEEDS))"
