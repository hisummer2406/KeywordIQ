name: Deploy Main to ECS

# 仅手动触发（workflow_dispatch），不设自动部署触发器；SHA 与三项 CI 校验见下方 job。
on:
  workflow_dispatch:

concurrency:
  group: deploy-v2-ecs
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    # 工作流页面可选择任意分支；只允许 V2 的 main 分支触发。
    if: github.ref == 'refs/heads/main'
    # 公开仓库不挂自托管 runner；私钥只落 $RUNNER_TEMP 并在 always() 清理，见下方两步。
    runs-on: ubuntu-latest
    # 部署密钥放在 production 环境，环境只允许 main 分支使用。
    environment: production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 核验目标 SHA 的 main push CI 发布门禁
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { verifyRelease } = require('./.github/ci-evidence.cjs');
            const run = await verifyRelease({ github, context });
            core.info(`已核验 CI run ${run}`);

      - name: 配置 SSH 连接
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          # 不写 ~/.ssh：私钥只放本 job 的临时目录。
          umask 077
          install -d -m 700 "$RUNNER_TEMP/ecs-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ecs-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ecs-ssh/known_hosts"

      - name: 部署已验证的 V2 SHA
        env:
          ECS_SSH_HOST: ${{ secrets.ECS_SSH_HOST }}
          ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$ECS_SSH_HOST"
          test -n "$ECS_SSH_PORT"
          test -n "$ECS_SSH_USER"

          ssh -p "$ECS_SSH_PORT" \
            -i "$RUNNER_TEMP/ecs-ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ecs-ssh/known_hosts" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${ECS_SSH_USER}@${ECS_SSH_HOST}" \
            "DEPLOY_REF='${GITHUB_REF}' DEPLOY_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          test "$DEPLOY_REF" = 'refs/heads/main' || {
            echo "拒绝非 main 分支：$DEPLOY_REF" >&2
            exit 1
          }

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '目标必须是完整的提交 SHA。' >&2
            exit 1
          }

          cd /var/www/keywordiq
          git diff --quiet && git diff --cached --quiet || {
            echo 'ECS 工作树存在已跟踪的本地修改，拒绝覆盖。请先人工处理。' >&2
            exit 1
          }

          # 显式更新远端跟踪引用，兼容原来只跟踪 v2 的 ECS 克隆。
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/origin/main || {
            echo '目标 SHA 不在 origin/main 历史中，拒绝部署。' >&2
            exit 1
          }

          current_branch="$(git branch --show-current)"
          case "$current_branch" in
            v2|main) ;;
            *) echo "ECS 当前分支不是 v2 或 main，拒绝部署：$current_branch" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD "$DEPLOY_SHA" || {
            echo 'ECS 当前提交无法快进到目标 SHA，拒绝部署。' >&2
            exit 1
          }
          if [[ "$current_branch" == 'v2' ]]; then
            if git show-ref --verify --quiet refs/heads/main; then
              test "$(git rev-parse refs/heads/main)" = "$(git rev-parse HEAD)" || {
                echo 'ECS 已有不同的本地 main，拒绝覆盖。请先核实并归档该引用。' >&2
                exit 1
              }
              git switch main
            else
              git switch --no-track -c main
            fi
          fi
          git merge --ff-only "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || {
            echo 'ECS 当前提交不等于已核验 SHA，拒绝继续。' >&2
            exit 1
          }

          sudo -n /usr/sbin/nginx -t >/dev/null || {
            echo 'www 尚未配置部署所需的免密 sudo，参照 .github/v2-ecs-cd.md 完成一次性引导。' >&2
            exit 1
          }
          ./deploy.sh --yes
          curl --fail --silent --show-error \
            --resolve key.liangtong.online:443:127.0.0.1 \
            https://key.liangtong.online/health >/dev/null
          REMOTE

      - name: 清理 SSH 私钥
        if: always()
        run: rm -rf "$RUNNER_TEMP/ecs-ssh"
