name: Deploy V2 to ECS

# GitHub 只会在 workflow_dispatch 文件存在于默认分支时显示“Run workflow”。
# 选择 v2 分支运行后，GitHub 使用 v2 上同路径的完整工作流；本文件只注册入口，
# 绝不连接 ECS 或读取部署凭证。
on:
  workflow_dispatch:

jobs:
  select-v2:
    runs-on: ubuntu-latest
    steps:
      - name: 提示选择 V2 分支
        run: |
          echo '请在 Run workflow 的 Branch 下拉框中选择 v2。'
          exit 1
