# 铁律检查的已知违规基线（棘轮）
#
# 这里登记的是**规则建立之前就存在**的违规。它们被放行，好让提交门禁今天就是绿的；
# 但 test_conventions.py 会同时保证两件事：
#
#   1. 出现基线之外的新违规 → 测试失败（回归被挡住）
#   2. 基线里的某项已经修好 → 测试也失败，要求你把它从这里删掉
#
# 第 2 条是关键：没有它，基线会腐烂成永久豁免。
#
# 清偿这些债务不属于「搭 harness」的范围，应各自单独开变更修。

[dead_settings]
# config.py 里定义了、但全仓无人读取的配置项。
#
# 曾有 MAX_FILE_SIZE：.env.example 与 CLAUDE.md 都公示「3GB 上传上限」，却没有
# 任何代码读它，那个上限并不存在。现已补上执行点——OSS 路径在 /oss/import 触发前
# head_object 称量（直传下字节不经应用服务器，那是服务端唯一能知道大小的时机），
# 本地退路在落盘时边写边计数、超限即中止并删掉半截文件。
known = []

[settings_doc_drift]
# config.py 默认值与 .env.example / CLAUDE.md 中公示值不一致的配置项。
#
# 曾有 DB_POOL_SIZE / DB_MAX_OVERFLOW 两项：文档与 .env.example 写 8/12，
# config.py 默认与实际 .env 都是 20/10。查下来更要紧的是算式本身错了——
# database.py 建了同步与异步两个引擎、共用同一组配置，全局上限要再乘 2
# （2 × 30 × 4 workers = 240，而非文档所写的 80）。三处已对齐到 20/10 并写明算式。
# 是否把池降到 8/12（上限 160）是另一个决定，需先有并发观测数据。
known = []

# except 块里用 logger.error 把异常当参数打印，栈信息就此丢失。
# CLAUDE.md 明文要求用 logger.exception —— 尤其后台任务，栈是唯一线索来源。
# import_service.py 那处正是后台任务 run_import 的失败分支，最该有栈的地方。
# user_crud.py 的 11 处伴随「返值式错误」写法，与 CLAUDE.md「业务错误一律抛不返」
# 是同一笔债，宜一并重构而非逐行改日志。
#
# 按文件计数而非行号：行号会随上方任何增删漂移，计数不会。计数只许降不许升。
#
# main.py 的 6 处（lifespan 启动/关闭与健康检查）与 import_service.py 的 1 处
# （后台任务失败分支）已改为 logger.exception，故从基线移除。
# 剩下的 11 处绑在「返值式错误」写法上（return False, "消息", None），单改日志没有
# 意义——应连同改成抛 APIError，与 CLAUDE.md「业务错误一律抛不返」一并了结。
[lossy_exception_logging.known]
"app/user/user_crud.py" = 11
